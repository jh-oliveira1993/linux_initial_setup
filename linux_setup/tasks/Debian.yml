---
- name: Getting system arch
  shell: dpkg --print-architecture
  register: sys_arch

- name: Run the equivalent of "apt-get update" as a separate step
  apt:
    update_cache: yes

- name: Uninstall all docker conflicting packages
  apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-v2
      - podman-docker
      - containerd runc
    state: absent

- name: Create directory for apt keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Download Zabbix GPG key
  apt_key:
    url: https://repo.zabbix.com/zabbix-official-repo.key
    state: present

- name: Add Docker and Zabbix repository
  apt_repository:
    repo: "{{ item.url }}"
    state: present
    filename: "{{ item.filename }}"
  with_items:
    - url: "deb [arch={{ sys_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
      filename: docker
    - url: "deb https://repo.zabbix.com/zabbix/{{ zbx_maj_ver }}.{{ zbx_min_ver }}/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} main"
      filename: zabbix

- name: Run the equivalent of "apt-get update" as a separate step again
  apt:
    update_cache: yes

- name: Install basic packages
  apt:
    name:
      - tree
      - vim
      - ca-certificates
      - curl
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - neofetch
      - zabbix-agent2
      - qemu-guest-agent
    state: present
